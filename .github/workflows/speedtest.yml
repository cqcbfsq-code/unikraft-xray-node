name: Node Speedtest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # weekly

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download clients
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          unzip -oq xray.zip -d xray && chmod +x xray/xray
          curl -fsSL -o hysteria https://github.com/apernet/hysteria/releases/download/app/v2.6.3/hysteria-linux-amd64
          chmod +x hysteria
      - name: Write configs
        run: |
          echo ''  | base64 -d > ws.json
          echo ''  | base64 -d > xhttp.json
          echo 'c2VydmVyOiAyMy4xNTYuMTM2LjExODozMTcwCmF1dGg6IDIwMjUwOTMwCnRsczoKICBzbmk6IHd3dy5iaW5nLmNvbQogIGluc2VjdXJlOiB0cnVlCnNvY2tzNToKICBsaXN0ZW46IDEyNy4wLjAuMToxMDgwMAo=' | base64 -d > hy.yaml

      - name: Speed UK-WS-443
        run: |
          export NODE_NAME=UK-WS-443
          ./xray/xray run -c ws.json > ws.log 2>&1 &
          sleep 6
          echo "--- $NODE_NAME ---"
          lat=$(curl -sS --max-time 30 -x socks5h://127.0.0.1:10800 https://www.google.com/generate_204 -o /dev/null -w '%{time_total}' || echo 999)
          echo "latency_connect=${lat}s"
          r1=$(curl -sS --max-time 90 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=10000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s1=${r1%%|*}; t1=${r1##*|}
          mbps1=$(awk "BEGIN{printf \"%.2f\", $s1*8/1000000}")
          echo "10MB: ${mbps1} Mbps (${t1}s)"
          r2=$(curl -sS --max-time 120 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=30000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s2=${r2%%|*}; t2=${r2##*|}
          mbps2=$(awk "BEGIN{printf \"%.2f\", $s2*8/1000000}")
          echo "30MB: ${mbps2} Mbps (${t2}s)"
          echo "$NODE_NAME: lat=${lat}s 10MB=${mbps1}Mbps 30MB=${mbps2}Mbps" >> $GITHUB_STEP_SUMMARY

          pkill -f 'xray run' || true

      - name: Speed UK-XHTTP-8443
        run: |
          export NODE_NAME=UK-XHTTP-8443
          ./xray/xray run -c xhttp.json > xhttp.log 2>&1 &
          sleep 6
          echo "--- $NODE_NAME ---"
          lat=$(curl -sS --max-time 30 -x socks5h://127.0.0.1:10800 https://www.google.com/generate_204 -o /dev/null -w '%{time_total}' || echo 999)
          echo "latency_connect=${lat}s"
          r1=$(curl -sS --max-time 90 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=10000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s1=${r1%%|*}; t1=${r1##*|}
          mbps1=$(awk "BEGIN{printf \"%.2f\", $s1*8/1000000}")
          echo "10MB: ${mbps1} Mbps (${t1}s)"
          r2=$(curl -sS --max-time 120 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=30000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s2=${r2%%|*}; t2=${r2##*|}
          mbps2=$(awk "BEGIN{printf \"%.2f\", $s2*8/1000000}")
          echo "30MB: ${mbps2} Mbps (${t2}s)"
          echo "$NODE_NAME: lat=${lat}s 10MB=${mbps1}Mbps 30MB=${mbps2}Mbps" >> $GITHUB_STEP_SUMMARY

          pkill -f 'xray run' || true

      - name: Speed Hy2-Lunes
        run: |
          export NODE_NAME=Hy2-Lunes
          ./hysteria client -c hy.yaml > hy.log 2>&1 &
          sleep 8
          echo "--- $NODE_NAME ---"
          lat=$(curl -sS --max-time 30 -x socks5h://127.0.0.1:10800 https://www.google.com/generate_204 -o /dev/null -w '%{time_total}' || echo 999)
          echo "latency_connect=${lat}s"
          r1=$(curl -sS --max-time 90 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=10000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s1=${r1%%|*}; t1=${r1##*|}
          mbps1=$(awk "BEGIN{printf \"%.2f\", $s1*8/1000000}")
          echo "10MB: ${mbps1} Mbps (${t1}s)"
          r2=$(curl -sS --max-time 120 -x socks5h://127.0.0.1:10800 'https://speed.cloudflare.com/__down?bytes=30000000' -o /dev/null -w '%{speed_download}|%{time_total}' || echo '0|999')
          s2=${r2%%|*}; t2=${r2##*|}
          mbps2=$(awk "BEGIN{printf \"%.2f\", $s2*8/1000000}")
          echo "30MB: ${mbps2} Mbps (${t2}s)"
          echo "$NODE_NAME: lat=${lat}s 10MB=${mbps1}Mbps 30MB=${mbps2}Mbps" >> $GITHUB_STEP_SUMMARY

          pkill -f 'hysteria client' || true
